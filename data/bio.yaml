paragraphs:
  - >-
    Some kind of software engineer exploring firmware, hardware, and movement.
    Previously worked on threat engineering infrastructure at
    [Amazon](https://aws.amazon.com/).

  - >-
    Was deeply involved with
    [UBC Thunderbots](https://github.com/UBC-Thunderbots),
    [UBC ECESS](https://ece.ubc.ca/student-life/student-societies-and-clubs/),
    and [UBC IEEE](http://www.ubcieee.org/).
    Read about why mentorship and outreach matter
    [here](https://apsc.ubc.ca/spotlight/kelvin-koon).

  - >-
    Self-expression, problem-solving, and community endlessly inspire me.
    Included but not limited to
    [dance](https://www.youtube.com/watch?v=9-cyXSq1xnk),
    figure skating,
    [competitive Pokémon](https://www.youtube.com/watch?v=BhwLpo8hQpY),
    and [photography](https://frame1photography.pixieset.com/).
